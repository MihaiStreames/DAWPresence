[package]
name         = "dawpresence"
version      = "3.0.4"
edition      = "2024"
rust-version = "1.92"
authors      = ["MihaiStreames <72852703+MihaiStreames@users.noreply.github.com>"]
description  = "Show what you are creating on Discord."
repository   = "https://github.com/MihaiStreames/DAWPresence"
homepage     = "https://github.com/MihaiStreames/DAWPresence"
license      = "MIT"
keywords     = ["discord", "rich-presence", "daw", "audio-production", "music"]
categories   = ["desktop-applications"]

[package.metadata.winresource]
FileDescription  = "Show what you are creating on Discord."
ProductName      = "DAWPresence"
LegalCopyright   = "MIT"
CompanyName      = "MihaiStreames"
OriginalFilename = "DAWPresence.exe"

[lints.rust]
future_incompatible       = { level = "warn", priority = -1 }
nonstandard_style         = { level = "warn", priority = -1 }
rust_2018_idioms          = { level = "warn", priority = -1 }
trivial_numeric_casts     = "warn"
unreachable_pub           = "warn"
unsafe_code               = "warn"
unsafe_op_in_unsafe_fn    = "warn"
unused_crate_dependencies = "warn"
unused_import_braces      = "warn"
unused_lifetimes          = "warn"
unused_macro_rules        = "warn"
unused_qualifications     = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"

[lints.clippy]
all      = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }

# picked from nursery: genuinely useful
missing_const_for_fn = "warn"

# cast lints: intentional, Win32 APIs require specific widths
cast_possible_truncation = "allow"
cast_possible_wrap       = "allow"
cast_precision_loss      = "allow"
cast_sign_loss           = "allow"

# style preferences
wildcard_imports = "allow"

[dependencies]
confy = "2.0.0"
crossbeam-channel = "0.5.15"
discord-rich-presence = "1.1.0"
fancy-regex = { version = "0.18.0", default-features = false, features = [
  "std",
  "unicode",
  "variable-lookbehinds",
] }
iced = { version = "0.14.0", default-features = false, features = ["crisp", "smol", "tiny-skia"] }
image = { version = "0.25.10", default-features = false, features = ["ico", "png"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tracing = { version = "0.1.44", features = ["release_max_level_off"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "fmt",
  "env-filter",
  "smallvec",
] }
tray-icon = "0.24.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
] }

[dev-dependencies]
toml = "1.1.2"

[build-dependencies]
winresource = "0.1.31"

[[bin]]
name = "DAWPresence"
path = "src/main.rs"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = "symbols"
panic         = "abort"
