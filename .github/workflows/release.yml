name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build release binary
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Check binary size
        shell: pwsh
        run: ./.github/workflows/scripts/check-binary-size.ps1

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: dawpresence-windows
          path: dist/DAWPresence.exe

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Extract release notes from changelog
        run: bash .github/workflows/scripts/extract-changelog.sh "$VERSION" > release_notes.md

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: dawpresence-windows
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: false
          files: dist/DAWPresence.exe

  virustotal:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v6

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: dawpresence-windows
          path: dist

      - name: Scan with VirusTotal
        uses: crazy-max/ghaction-virustotal@v5
        id: vt
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            dist/DAWPresence.exe

      - name: Append VirusTotal results to release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/workflows/scripts/append-virustotal.sh "$VERSION" "${{ steps.vt.outputs.analysis }}"
