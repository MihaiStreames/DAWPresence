name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    name: Build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
          cache: false

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dawpresence-exe-raw
          path: target/release/DAWPresence.exe

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dawpresence-exe-raw
          path: dist

      - name: Install UPX
        run: sudo apt-get install -y upx

      - name: Pack binary
        run: upx --best dist/DAWPresence.exe

      - name: Upload packed binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dawpresence-exe
          path: dist/DAWPresence.exe

  installer:
    name: Installer
    runs-on: windows-latest
    needs: pack
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dawpresence-exe
          path: dist

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version ($env:VERSION -replace '^v', '')

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dawpresence-windows
          path: dist/

  size-check:
    name: Size check
    runs-on: ubuntu-latest
    needs: installer
    permissions: {}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dawpresence-windows
          path: dist

      - name: Check binary size
        run: |
          size=$(stat -c%s dist/DAWPresence.exe)
          limit=$((2 * 1024 * 1024))
          if [ "$size" -gt "$limit" ]; then
            echo "error: $((size / 1024))KB exceeds 2MB limit"
            exit 1
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: size-check
    permissions:
      contents: write # create GitHub release and upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dawpresence-windows
          path: dist

      - name: Generate SHA256 checksums
        run: bash .github/workflows/scripts/checksum.sh dist/DAWPresence.exe dist/DAWPresence-*-setup.exe

      - name: Extract release notes
        run: bash .github/workflows/scripts/extract-changelog.sh "$VERSION" CHANGELOG.md > release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" --notes-file release_notes.md \
            dist/DAWPresence.exe \
            dist/DAWPresence.exe.sha256 \
            dist/DAWPresence-*-setup.exe \
            dist/DAWPresence-*-setup.exe.sha256

  virustotal:
    name: VirusTotal
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write # append VirusTotal results to release body
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dawpresence-windows
          path: dist

      - name: Scan with VirusTotal
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        id: vt
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            dist/DAWPresence.exe
            dist/DAWPresence-*-setup.exe

      - name: Append VirusTotal results to release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STEPS_VT_OUTPUTS_ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: bash .github/workflows/scripts/append-virustotal.sh "$VERSION" "${STEPS_VT_OUTPUTS_ANALYSIS}"
