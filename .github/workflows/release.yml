name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Extract version from Cargo.toml
        id: get
        run: |
          version=$(bash .github/workflows/scripts/get-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version "${{ needs.version.outputs.version }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dawpresence-windows
          path: dist/

  checks:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dawpresence-windows
          path: dist

      - name: Check binary size
        run: bash .github/workflows/scripts/check-binary-size.sh

  release:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dawpresence-windows
          path: dist

      - name: Generate SHA256 checksums
        run: bash .github/workflows/scripts/generate-checksum.sh

      - name: Extract release notes
        run: bash .github/workflows/scripts/extract-changelog.sh "$VERSION" > release_notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: false
          files: |
            dist/DAWPresence.exe
            dist/DAWPresence.exe.sha256
            dist/DAWPresence-*-setup.exe
            dist/DAWPresence-*-setup.exe.sha256

  virustotal:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dawpresence-windows
          path: dist

      - name: Scan with VirusTotal
        uses: crazy-max/ghaction-virustotal@v5
        id: vt
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            dist/DAWPresence.exe
            dist/DAWPresence-*-setup.exe

      - name: Append VirusTotal results to release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/workflows/scripts/append-virustotal.sh "$VERSION" "${{ steps.vt.outputs.analysis }}"
