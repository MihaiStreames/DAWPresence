name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    name: Build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --no-self-update

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          lookup-only: true

      - name: Build release binary
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version ($env:VERSION -replace '^v', '')

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dawpresence-windows
          path: dist/

  size-check:
    name: Size check
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dawpresence-windows
          path: dist

      - name: Check binary size
        run: bash .github/workflows/scripts/check-binary-size.sh

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: size-check
    permissions:
      contents: write # creates the GitHub release and uploads assets
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dawpresence-windows
          path: dist

      - name: Generate SHA256 checksums
        run: bash .github/workflows/scripts/checksum.sh dist/DAWPresence.exe dist/DAWPresence-*-setup.exe

      - name: Extract release notes
        run: bash .github/workflows/scripts/extract-changelog.sh "$VERSION" > release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$VERSION" --notes-file release_notes.md dist/DAWPresence.exe dist/DAWPresence.exe.sha256 dist/DAWPresence-*-setup.exe dist/DAWPresence-*-setup.exe.sha256

  virustotal:
    name: VirusTotal
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write # appends scan results to the GitHub release body
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dawpresence-windows
          path: dist

      - name: Scan with VirusTotal
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        id: vt
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: dist/DAWPresence.exe dist/DAWPresence-*-setup.exe

      - name: Append VirusTotal results to release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STEPS_VT_OUTPUTS_ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: bash .github/workflows/scripts/append-virustotal.sh "$VERSION" "${STEPS_VT_OUTPUTS_ANALYSIS}"
