name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Extract version from Cargo.toml
        id: get
        run: |
          version=$(bash .github/workflows/scripts/get-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (pinned 2026-04-30)

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build release binary
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version "${{ needs.version.outputs.version }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dawpresence-windows
          path: dist/

  checks:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dawpresence-windows
          path: dist

      - name: Check binary size
        run: bash .github/workflows/scripts/check-binary-size.sh

  release:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dawpresence-windows
          path: dist

      - name: Generate SHA256 checksums
        run: bash .github/workflows/scripts/generate-checksum.sh

      - name: Extract release notes
        run: bash .github/workflows/scripts/extract-changelog.sh "$VERSION" > release_notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          body_path: release_notes.md
          generate_release_notes: false
          files: |
            dist/DAWPresence.exe
            dist/DAWPresence.exe.sha256
            dist/DAWPresence-*-setup.exe
            dist/DAWPresence-*-setup.exe.sha256

  virustotal:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dawpresence-windows
          path: dist

      - name: Scan with VirusTotal
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        id: vt
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            dist/DAWPresence.exe
            dist/DAWPresence-*-setup.exe

      - name: Append VirusTotal results to release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/workflows/scripts/append-virustotal.sh "$VERSION" "${{ steps.vt.outputs.analysis }}"
