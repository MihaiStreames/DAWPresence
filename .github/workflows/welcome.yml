name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Hey, thanks for opening your first issue!

            I'll take a look soon. Just make sure you've included the info in the template (OS, DAW, version, logs if you can).
          pr_message: |
            Hey, thanks for your first PR!

            I'll review it soon. Just make sure CI passes and you've run `cargo fmt` + `cargo clippy`.
