name: CI

on:
  pull_request:
    branches: [master]
    paths:
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "daws.json"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # verifies the readme's linux build path (mingw cross-compile)
          - name: Cross-build (windows-gnu)
            os: ubuntu-latest
            target: x86_64-pc-windows-gnu
          - name: Build and test (windows-msvc)
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mingw toolchain
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          components: rustfmt, clippy
          rustflags: ""
          cache-shared-key: ci-${{ matrix.os }}

      - name: Format check
        if: matrix.os == 'windows-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: cargo clippy --all-targets --target "$TARGET" -- -D warnings

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: cargo build --release --target "$TARGET"

      # cross-compiled windows-gnu test binaries can't run on the linux runner
      - name: Test
        if: matrix.os == 'windows-latest'
        run: cargo test
