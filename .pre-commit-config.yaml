fail_fast: true

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.ps1$
        priority: 0

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.25.2
    hooks:
      - id: zizmor
        priority: 0

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.3
    hooks:
      - id: prettier
        types_or: [json, markdown, yaml]
        priority: 1

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        priority: 1

  - repo: local
    hooks:
      - id: cargo-check
        name: cargo check
        entry: bash -c '[[ "$OSTYPE" == "msys" || "$OSTYPE" == "cygwin" || "$OSTYPE" == "win32" ]] && cargo check || echo "skipped (non-Windows host)"'
        language: system
        types: [rust]
        pass_filenames: false
        priority: 0

      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c '[[ "$OSTYPE" == "msys" || "$OSTYPE" == "cygwin" || "$OSTYPE" == "win32" ]] && cargo clippy --all-targets -- -D warnings || echo "skipped (non-Windows host)"'
        language: system
        types: [rust]
        pass_filenames: false
        priority: 0

      - id: cargo-test
        name: cargo test
        entry: bash -c '[[ "$OSTYPE" == "msys" || "$OSTYPE" == "cygwin" || "$OSTYPE" == "win32" ]] && cargo test || echo "skipped (non-Windows host)"'
        language: system
        types: [rust]
        pass_filenames: false
        priority: 0

      - id: taplo
        name: taplo fmt
        entry: uvx taplo fmt
        language: system
        types: [toml]
        priority: 1

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
        priority: 1
